[package]
name = "kawan"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Kawan GPUI desktop client"

[dependencies]
base64 = "0.22"
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
url = "2"

[profile.dev]
# GPUI's dependency tree is large; keep dev builds reasonably fast while
# dependencies stay optimized for a usable UI.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
